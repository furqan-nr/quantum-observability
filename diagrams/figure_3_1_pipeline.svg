<rect x="20" y="30" width="210" height="120" rx="7" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="125.0" y="66.3" text-anchor="middle" font-size="13" fill="#1A2A3A" font-weight="bold">1.  Manifest &amp; Instrument</text>
<text x="125.0" y="93.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">Builds a static manifest and</text>
<text x="125.0" y="108.9" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">instruments transpilation, so</text>
<text x="125.0" y="124.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">pass stages are observed.</text>
<rect x="267.5" y="30" width="210" height="120" rx="7" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="372.5" y="66.3" text-anchor="middle" font-size="13" fill="#1A2A3A" font-weight="bold">2.  Events &amp; Cohorts</text>
<text x="372.5" y="93.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">Constructs change-events,</text>
<text x="372.5" y="108.9" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">assigns non-pooled cohorts,</text>
<text x="372.5" y="124.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">and a mutation engine.</text>
<rect x="515.0" y="30" width="210" height="120" rx="7" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="620.0" y="66.3" text-anchor="middle" font-size="13" fill="#1A2A3A" font-weight="bold">3.  Tiered Oracles</text>
<text x="620.0" y="93.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">Applies width-tiered oracles</text>
<text x="620.0" y="108.9" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">to produce write-once</text>
<text x="620.0" y="124.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">ground-truth labels.</text>
<rect x="762.5" y="30" width="210" height="120" rx="7" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="867.5" y="66.3" text-anchor="middle" font-size="13" fill="#1A2A3A" font-weight="bold">4.  Selection &amp; Baselines</text>
<text x="867.5" y="93.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">Runs the transparent</text>
<text x="867.5" y="108.9" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">risk_score selector against</text>
<text x="867.5" y="124.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">five baselines under a budget.</text>
<rect x="1010.0" y="30" width="210" height="120" rx="7" fill="#DAE8FC" stroke="#6C8EBF" stroke-width="1.4"/>
<text x="1115.0" y="66.3" text-anchor="middle" font-size="13" fill="#1A2A3A" font-weight="bold">5.  Metrics &amp; Gates</text>
<text x="1115.0" y="93.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">Computes the metric suite</text>
<text x="1115.0" y="108.9" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">and enforces six validity</text>
<text x="1115.0" y="124.4" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">gates before any result.</text>
<rect x="20" y="210" width="1200" height="80" rx="7" fill="#F5F5F5" stroke="#666666" stroke-width="1.4"/>
<text x="620.0" y="239.1" text-anchor="middle" font-size="13" fill="#1A2A3A" font-weight="bold">Shared reproducibility substrate</text>
<text x="620.0" y="256.2" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">two-layer execution environment  ·  write-once artifacts  ·  CPU-time cost calibration</text>
<text x="620.0" y="271.7" text-anchor="middle" font-size="10.5" fill="#3B475C" font-weight="normal">frozen change-stage map  ·  group-level temporal split  ·  strict claim-scope rule</text>
</svg>